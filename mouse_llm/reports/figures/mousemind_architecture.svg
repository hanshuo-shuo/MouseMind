<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">MouseMind hierarchy and Verified DPO LoRA adaptation</title>
  <desc id="desc">Inference: instruction, semantic state, and eight-step history feed a MiniMind skill planner with a task LoRA. The planner emits one of three skill JSON responses, a specialist executes it, and the environment receives a low-level action. Training: verified exact-state counterfactual outcomes provide SFT labels and DPO preference pairs. Verified DPO continues training the SFT LoRA while a frozen copy serves as reference. The MiniMind backbone and execution hierarchy do not change.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#73849a"/></marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#0b8c79"/></marker>
  </defs>
  <rect width="1400" height="620" rx="24" fill="#f7f9fc"/>
  <text x="44" y="55" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#14253b">MouseMind: one hierarchy, two LoRA training stages</text>
  <text x="44" y="88" font-family="Arial,sans-serif" font-size="18" fill="#52647b">Verified DPO updates the skill planner adapter; the three-skill interface and specialist stay the same.</text>

  <text x="44" y="133" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#596b80">INFERENCE · UNCHANGED CONTROL PATH</text>
  <rect x="35" y="152" width="260" height="178" rx="16" fill="#fff" stroke="#d4deea" stroke-width="2"/>
  <text x="57" y="191" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#213047">Planner input</text>
  <text x="57" y="227" font-family="Arial,sans-serif" font-size="17" fill="#43546b">Instruction</text>
  <text x="57" y="260" font-family="Arial,sans-serif" font-size="17" fill="#43546b">Semantic state</text>
  <text x="57" y="293" font-family="Arial,sans-serif" font-size="17" fill="#43546b">8-step history</text>
  <line x1="303" y1="242" x2="329" y2="242" stroke="#73849a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="340" y="152" width="264" height="178" rx="16" fill="#173657"/>
  <text x="472" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#fff">MiniMind planner</text>
  <text x="472" y="239" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#cde2fa">frozen backbone</text>
  <rect x="377" y="263" width="190" height="41" rx="9" fill="#0b8c79"/>
  <text x="472" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">skill-planner LoRA</text>
  <line x1="612" y1="242" x2="638" y2="242" stroke="#73849a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="649" y="152" width="291" height="178" rx="16" fill="#eaf2fc" stroke="#b5d0ed" stroke-width="2"/>
  <text x="671" y="187" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#213047">One JSON skill</text>
  <text x="671" y="226" font-family="Arial,sans-serif" font-size="17" fill="#335572">go_to_goal</text>
  <text x="671" y="259" font-family="Arial,sans-serif" font-size="17" fill="#335572">evade_predator</text>
  <text x="671" y="292" font-family="Arial,sans-serif" font-size="17" fill="#335572">hold_position</text>
  <line x1="948" y1="242" x2="974" y2="242" stroke="#73849a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="985" y="152" width="174" height="178" rx="16" fill="#d8e9fc" stroke="#9fc1e5" stroke-width="2"/>
  <text x="1072" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#173657">Specialist</text>
  <text x="1072" y="257" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#335572">executes skill</text>
  <line x1="1167" y1="242" x2="1193" y2="242" stroke="#73849a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1204" y="152" width="160" height="178" rx="16" fill="#176c72"/>
  <text x="1284" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">Low-level</text>
  <text x="1284" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">action</text>

  <text x="44" y="379" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#596b80">TRAINING · VERIFIED ADAPTER UPDATE</text>
  <rect x="35" y="399" width="296" height="164" rx="16" fill="#fff" stroke="#d4deea" stroke-width="2"/>
  <text x="55" y="443" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#213047">Exact-state rollouts</text>
  <text x="55" y="476" font-family="Arial,sans-serif" font-size="16" fill="#43546b">Shared counterfactual utility</text>
  <text x="55" y="507" font-family="Arial,sans-serif" font-size="16" fill="#43546b">Skill labels + preference pairs</text>
  <line x1="339" y1="481" x2="372" y2="481" stroke="#73849a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="383" y="399" width="270" height="164" rx="16" fill="#eaf2fc" stroke="#b5d0ed" stroke-width="2"/>
  <text x="518" y="451" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#173657">Seed-clean SFT LoRA</text>
  <text x="518" y="485" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#43546b">initial policy adapter</text>
  <text x="518" y="518" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#43546b">copied as frozen reference</text>
  <line x1="661" y1="481" x2="694" y2="481" stroke="#0b8c79" stroke-width="3" marker-end="url(#teal-arrow)"/>

  <rect x="705" y="399" width="309" height="164" rx="16" fill="#e4f5ef" stroke="#79c7ad" stroke-width="2"/>
  <text x="859" y="451" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#087e6d">Verified DPO LoRA</text>
  <text x="859" y="485" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#31564e">trainable adapter · β = 0.1</text>
  <text x="859" y="518" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#31564e">same MiniMind skill planner</text>
  <path d="M 859 399 V 360 H 472 V 338" fill="none" stroke="#0b8c79" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#teal-arrow)"/>
  <text x="44" y="595" font-family="Arial,sans-serif" font-size="15" fill="#64748b">DPO optimizes LoRA weights from verified preference pairs; it does not train a replacement controller.</text>
</svg>
